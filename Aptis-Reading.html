<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aptis Reading · Luyện đọc</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f4;color:#152e2c;font:16px/1.6 'Segoe UI',sans-serif}header{background:#123e38;color:white;padding:24px max(5vw,20px);font-size:21px;font-weight:700}header span{color:#badacf;font-weight:400}main{max-width:1060px;margin:auto;padding:24px 18px 70px}nav{display:flex;gap:8px;flex-wrap:wrap}button,select,input{font:inherit;border:1px solid #afc3ba;border-radius:8px;padding:9px 14px;background:white;color:inherit}button{cursor:pointer}button.active,.primary{background:#176650;color:white;border-color:#176650}h1{font: bold clamp(32px,5vw,52px)/1.25 Arial,sans-serif;margin:26px 0 16px}select,input{max-width:100%;width:100%}#lesson{width:auto}article{background:white;border:1px solid #d5e1da;padding:clamp(16px,3vw,32px);border-radius:14px;margin:18px 0}label{display:block;font-weight:600;margin:0 0 8px}.question{padding:17px 0;border-bottom:1px solid #dde7e0}.question:last-child{border:0}.num{color:#477a68;font-size:14px}aside p{margin-top:4px}h3{margin-bottom:0}footer{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.ok{color:#146442}.bad{color:#993c25}output{display:block;font-weight:700}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #df9e3a}

}output.ok,output.bad{margin:8px 0;padding:10px 14px;border-left:3px solid currentColor;background:#f6f8f7;font-weight:400}output:empty{display:none}.reason{color:#273e37}</style><header>Aptis <span>/ Reading</span></header><main><nav aria-label="Chọn phần"></nav><h1></h1><select id="lesson" aria-label="Chọn bài"></select><p id="instruction"></p><aside></aside><article></article><footer><button class="primary" id="grade">Chấm điểm</button><button id="reset">Làm lại bài</button><output id="score" aria-live="polite"></output></footer></main><script>const data=[[{"title":"Đạp xe đi làm","q":[["In the ______, I cycle to work.","morning"],["My ______ cycle to work with me.","friends"],["Therefore, I ______ my car at my house.","leave"],["I feel ______ after cycling to work.","good"],["Then, I drink water and eat healthy ______.","food"]],"reading":[]},{"title":"Chỉ đường đến nhà","q":[["When you are at the train ______, go to the main gate.","station"],["The bus ______ are near.","stops"],["My house is on Parkon Street. It’s ______, so you can not miss it.","green"],["After you come, we will have ______.","dinner"],["In the evening, we can watch some ______ together.","films"]],"reading":[]},{"title":"Ở làng quê","q":[["We are ______ in a small house in the village.","staying"],["There are a lot of trees in the ______.","garden"],["We go fishing with our ______.","children"],["Today, we are going to ______ the town by bus.","visit"],["There are some ______ buildings there.","old"]],"reading":[]},{"title":"Nơi ở và công việc","q":[["I ______ the area where I live now.","love"],["My house has a kitchen but it is very ______.","small"],["I work at a ______ and I sell clothes.","shop"],["Every day I talk to many ______.","people"],["I am on my holiday and I’m excited that I can ______ you soon.","visit"]],"reading":[]}],[{"title":"Weekend activities/ Sporty Day","q":[["Câu 1","It started early on Saturday morning with a ten-mile race for adults."],["Câu 2","Sixty men and women ran in this, and Ms Kamur won with a very fast time."],["Câu 3","After receiving the prize, the children's activities and competitions began."],["Câu 4","These activities included football, jumping, and swimming, and they had lots of fun."],["Câu 5","They were all very hungry after all these, so they enjoyed tasty food and drinks with their parents."]],"reading":[]},{"title":"Making Films","q":[["Câu 1","The films in that period were different from the films of today."],["Câu 2","This is because they were black and white, and there was no sound."],["Câu 3","In addition to these technical limitations, film producers also had a very low budget."],["Câu 4","This lack of money mostly affected actors, and they didn't earn much."],["Câu 5","Things have changed over time, and some of them have earned millions of dollars after appearing in films."]],"reading":[]},{"title":"History of travel","q":[["Câu 1","In the past, transportation was only available to the rich."],["Câu 2","The invention of cars and trains had changed everything and made travelling cheaper."],["Câu 3","After these two means of transport, travelling becomes even easier with airplanes."],["Câu 4","Because flying with them is so fast, more people now go abroad for holiday and business."],["Câu 5","It is more convenient to travel to other part of the world due to the improvement in transports."]],"reading":[]},{"title":"New Café in Town","q":[["Câu 1","It was full of people, and the staff were working hard on their first day."],["Câu 2","Despite the crowd, they found me a nice table and brought me a menu."],["Câu 3","When I first looked at the menu, I was disappointed since I hoped to see a variety of dishes."],["Câu 4","I had to choose one of those, so I decided to choose the most expensive sandwich."],["Câu 5","It was really good with cheese topping, and I would definitely go back to this place."]],"reading":[["Câu mở đầu","Last week I went to a new opening cafe on Corner Street."]]},{"title":"Writing about a place/ Homework next week","q":[["Câu 1","Before starting writing, you should do research on many details of that place."],["Câu 2","These must include data on its people, language, and history."],["Câu 3","While giving information about three areas, you will also compare it with your own country."],["Câu 4","This comparison will understand the similarities between the two countries."],["Câu 5","There may not be many of those, but still you will see some common areas."]],"reading":[]},{"title":"A famous singer Jade Nobelston","q":[["Câu 1","Jade Nobelston is a famous stage singer and performer."],["Câu 2","Before becoming famous at a young age, he studied art and music at high school."],["Câu 3","During this education, he started to perform on stage."],["Câu 4","During his performances on stage, he likes to wear bright clothes and paint his face."],["Câu 5","This strange ways of dressing and his songs attracted people's attention."],["Câu 6","They started to follow him on social media and he is now very famous."]],"reading":[]},{"title":"University Welcome Day","q":[["Câu 1","All students will attend the welcoming day on Monday, the 19th."],["Câu 2","The day will begin at 10 a.m. in the morning with a short presentation."],["Câu 3","At the end of this talk, you will meet the heads of departments and teachers."],["Câu 4","These staff members will give you a guided tour in the buildings and our sport facilities in small groups."],["Câu 5","During this visit, you will need to stay with these students until lunch break."],["Câu 6","This meal will be provided on the second floor of the engineering building."]],"reading":[]},{"title":"Music festivals","q":[["Câu 1","Last Saturday, a live music show was held in town park."],["Câu 2","The local authority planned, sponsored, and paid for everything."],["Câu 3","Because it was free, more than 5,000 people attended."],["Câu 4","Many of them arrived early and visited nearby shops while they were waiting for it to begin."],["Câu 5","The staff there had a busy day, but they were able to close early and watch the famous singer perform."],["Câu 6","He performed for two hours and everyone had great fun."]],"reading":[]},{"title":"The first American woman in space","q":[["Câu 1","Her father was a skilled worker and her mother was a teacher."],["Câu 2","With the support from parents, Mae went to university to study Science."],["Câu 3","Her degree allows her to get a seat on the training course in the USA."],["Câu 4","This is about space and it helps her to become a member of a research team."],["Câu 5","As a part of this group, she traveled in space and did a lot of experiments there."],["Câu 6","Some of those were about growing plants and some animals in a spaceship."]],"reading":[]},{"title":"End of term project","q":[["Câu 1","For end of term project, you need to choose at least 2 of these."],["Câu 2","It needs to include relevant images and your own text about the topic."],["Câu 3","Then you need to use images and written work to create a presentation."],["Câu 4","Your presentation offer your key points and you have around 5 minutes to talk."],["Câu 5","After this time, other students are able to ask questions and you need to answer them."]],"reading":[["Câu mở đầu","This semester we have studied several chapters about local history in the class."]]}],[{"title":"The music festival","q":[["Who was not impressed by the event overall?","Lisa"],["Who thought the event was expensive?","Robert"],["Who is disappointed with the weather?","James"],["Who likes meeting old friends?","Christina"],["Who enjoyed the final day of the music event?","James"],["Who thought the location was not good?","Christina"],["Who enjoyed all the music at the music event?","Robert"]],"reading":[["James","This is my first time going to a concert, and the experience was quite mixed. During the first two days, the music was rather ordinary, and the event would have been far more enjoyable if there had been just a little sunshine to brighten things up. Luckily, the last day completely changed my impression, as I finally got to see my favourite singers. Meeting them and enjoying the performances made the whole trip memorable and truly special."],["Lisa","I attend music festivals every year, and over time it has become something of a personal tradition. I really enjoy the energetic atmosphere where people come together to share music and excitement. This particular festival, however, felt quite different from what I am used to. The weather conditions were less than perfect, though it didn't bother me that much, as I have enjoyed festivals in the rain before. The venue was moderately convenient and the performances themselves were rather unremarkable. To be honest, I doubt I will choose to come back in the future."],["Robert","I don't like one particular kind of music being played at festivals, as I enjoy a wide range of genres to enjoy and dance to. Luckily, this event truly lived up to what I was hoping for. The songs and melodies were absolutely impressive, leaving a strong impression on me. Although there was some rain, I actually felt it made the atmosphere even more vibrant and fun. One drawback, however, the cost was quite high, which many students, including me, found difficult to afford. Organizers should reconsider the price more carefully."],["Christina","My band and I went to the music festival, and we delivered the kind of performance our audience had come to expect from us. The show turned out to be truly memorable, not only because of the energy on stage but also because some of our ex-band members were present. It felt great to reconnect with them and share stories after the performance. The atmosphere overall was very positive, and the crowd seemed to enjoy every moment. The only real challenge was that the venue was located quite far from the main road, which made moving our instruments and equipment rather inconvenient."]]},{"title":"Extreme sports","q":[["Who enjoys playing extreme sports after first attempt?","Jose"],["Who enjoys the nature while doing sports?","Sira"],["Who avoids doing any sports?","Bao"],["Who thinks extreme sports are not necessary for them?","Marisol"],["Who thinks training is important before doing extreme sports?","Jose"],["Who wishes they were able to do extreme sports more often?","Sira"],["Who prefers traditional sports?","Marisol"]],"reading":[["Jose","I don't usually like sports, but once I tried sea diving at the invitation of my friends. I fell in love with this sport ever since my first attempt. Extreme sports can be very dangerous, therefore, before I decided to take it up as a hobby, I made sure that I fully understood all the guidance from my expert trainers, who have years of experience. This helped me improve myself and feel more confident."],["Marisol","Some people like jumping out of aeroplanes or exploring the sea. I'm a pilot, and I have never understood why people would throw themselves into such danger. I once tried an extreme sport and realised I was right from the beginning. My job is already overwhelming and involves enough risky activities. Now, I prefer something more casual, such as baseball or volleyball."],["Sira","Doing free-diving requires a lot of patience and effort to become proficient. I live far away from the sea, so it is even more difficult for me. I can only do it a few times a year, which is never enough to satisfy my passion. Once I am in the water, I feel at home. I am surrounded by various types of fish and can almost touch them."],["Bao","As a child, I used to play sports because they were part of our school curriculum. I mean, whose school isn't? However, I have never enjoyed those activities. Some students are naturally gifted, as they have strong physiques and are able to endure long running sessions; however, not everyone is the same. For me, these lessons were rather a waste of time, as I preferred staying indoors and reading books."]]},{"title":"Childhood activities","q":[["Who preferred reading books as a child?","Sophia"],["Who enjoyed doing arts as a child?","Jack"],["Who enjoyed playing with other children in the past?","William"],["Who thought traditional games were much simpler?","Sarah"],["Who enjoyed playing games with their children?","Sarah"],["Who wished they could spend more time outdoors?","Jack"],["Who enjoyed playing modern games?","Sophia"]],"reading":[["Sarah","As a child, I played board games with my friends. The rules were simple, easy and straightforward to grasp, which made the games enjoyable and accessible. As I grew older, I came to believe that board games could be a wonderful way for families to bond. However, modern games have become far more complex, with numerous rules and a wide range of characters to choose from. Although I truly enjoyed playing with my two boys and we often laughed together, I found that learning how to play required quite a bit of effort."],["William","I preferred to play outdoors with my friends (peers) when I was small. Fortunately, the weather where we lived was usually pleasant, so we often spent hours running around and chasing each other on the field. At times, we would lie down on the grass and make funny faces, enjoying the carefree moments of childhood. Those memories remain incredibly precious to me and shaped my desire to be surrounded by people. Even now, I find it difficult to stay at home alone for long."],["Sophia","I wasn't able to move much as a child and even now. Instead, I was captivated by books (books are my companions) and often preferred reading in my free time. There was a library I frequently visited, where I could lose myself in different stories for hours. Nowadays, I don't read as much as I used to, but I also don't go out very often because I spend time on my computer. I especially enjoy interactive games, as they allow me to socialize and connect with people online."],["Jack","I enjoy playing outdoors. On gloomy days, which happened quite often, I would stare sadly out of the window, wishing I could be outside. There wasn't much to do indoors back then—until one day my mother surprised me with a box full of art supplies. Inside were vibrant palettes, paintbrushes of different sizes, and stacks of clean paper. That was the moment I discovered another passion: painting. I could spend hours simply gazing at a blank canvas, imagining what picture I might bring to life next."]]},{"title":"Volunteering","q":[["Who thinks volunteering enjoys physical benefits?","Chinua"],["Who thinks volunteering is a good way to make friends?","Chirish"],["Who thinks volunteering is a good reason to travel?","Chinua"],["Who thinks volunteering should help local communities?","Boyd"],["Who thinks volunteering is good for culture?","Boyd"],["Who thinks volunteering can help advance career?","Chirish"],["Who thinks volunteering can be helped by giving money?","Noah"]],"reading":[["Boyd","I understand many young people like volunteering abroad, but honestly, I feel most people are more interested in traveling. I believe we should use our time more meaningfully. Each town has many people in need. Their situations are different, and they don't have the means to improve their quality of life. They are individuals who have contributed a lot to the country. Sharing stories with them helps us understand the differences between generations. We can also broaden our knowledge about local history, traditions, and culture through their experiences."],["Chirish","My mother was very involved with local charities because she is part of that organization, but I'm not into it. I prefer volunteering abroad because I can develop soft skills — something that will benefit my future career. Also, meeting new people helps me expand my network and create valuable connections I can use later in my professional life."],["Noah","I'm busy with work these days and rarely have any free time to do anything, so spending even a few hours volunteering is difficult. I would have to take half a day off work. I see many people in need and they genuinely require some extra financial support. That's something I can help with because I earn a good salary. Making monthly donations is not a problem for me; it's how I show my support and contribution."],["Chinua","I don't have many financial resources but I believe there are many ways we can show kindness through volunteering. I'm retired now, and I currently help build houses for people in need. I work with a volunteering organization that already has clear plans in place. Through this work, I've had the chance to experience different foreign cultures. We're often sent to various countries to carry out these projects, so it's also a great way to travel while doing something meaningful. The jobs involves manual labor, so we're able to improve our physical health something that some people only begin to notice after a while."]]},{"title":"Choosing a Career","q":[["Who enjoyed working when training?","Chirish"],["Who think they benefited from working for free?","Olivia"],["Who thinks their training was too long?","Emma"],["Who enjoys working in a flexible work environment?","Grace"],["Who did not want to change to other careers?","Chirish"],["Who thinks it was hard to get the first job?","Grace"],["Who enjoyed doing things with their hands?","Emma"]],"reading":[["Olivia","When I finished school, I didn't really know what I wanted to do. Some people advised me to get a job right away. However, I preferred to gain some practical experience first. That's why I applied for many volunteering roles. Even though I didn't earn any money, I was able to try different kinds of work. Looking back, I'm happy with my decision because of the useful knowledge I gained."],["Chirish","I went straight to university after I graduated from high school. I had always wanted to become a teacher, so there was no need to look at other careers. Three months ago, I joined an internship at a local school. It was really an eye-opening experience, although the workload was heavier than I thought. Still, I believe it was very worthwhile."],["Emma","As a child, I lived near a plumber and sometimes worked with her. She asked me to do easy jobs like checking for pipe leaks or fastening the nails with a screw. So later, it felt natural for me to study at university to become an electrician. Now that I see there are short online electrical courses, I wish I had chosen that instead."],["Grace","After school, I wanted some time to figure out what I really wanted. So I started looking for temporary jobs. However, it was difficult to find one because most companies didn't accept people without experience. In the end, a game company contacted me and I agreed to work with them. The job was hybrid, so sometimes I worked in the evenings, but that was fine for me."]]}],[{"title":"The Arrival of the Four-Day Work Week","q":[["For many decades, working five or even six days a week was seen as the norm. However, with modern technology, changing values, and a greater focus on work-life balance, that lifestyle is becoming less relevant. Employees and companies alike are beginning to question whether spending most of one’s week at work is still necessary or productive.","A way of life now out of date"],["Supporters of the four-day work week argue that it offers numerous advantages for workers. With an extra day off, employees have more time to rest, spend with family, or pursue hobbies. Studies show that many people become more focused and productive when working fewer hours, leading to better performance and increased job satisfaction.","Benefits for employees"],["Despite its appeal, a shorter work week can also lead to financial strain. Businesses may face higher costs due to hiring additional staff or adjusting pay structures. Some industries—especially those that rely on hourly workers—might struggle to maintain profit margins, potentially resulting in reduced services or even layoffs.","Undesirable financial consequences"],["Not all employees adjust easily to a new schedule. Some may find it difficult to complete the same amount of work in fewer days, which can increase pressure and stress. In fast-paced industries, unexpected challenges may arise, such as scheduling conflicts or missed deadlines, making the transition more complicated than expected.","Unforeseen challenges for employees"],["For those who have followed a traditional work schedule for years, switching to a four-day week can be uncomfortable. Old habits and routines are hard to break, and some individuals may resist change even if it’s beneficial. It often takes time and support to help people adapt to a new way of working.","Difficult to give up old habits"],["Although the four-day work week sounds ideal for many, it might not be fair to everyone. For example, essential workers, healthcare staff, or those in hospitality may not have the option to reduce their hours. This could create inequality between different groups of employees and cause tension in the workplace.","Unfair for some people"],["Rather than applying a four-day week to all companies, experts suggest looking at flexible solutions. Some propose allowing employees to choose their working days, while others support shorter daily hours. These alternatives can offer similar benefits without disrupting businesses that rely on traditional schedules.","Alternative solutions worth considering"]],"reading":[]},{"title":"Mountain Summits","q":[["Even before the nineteenth century, mountains had always exerted a powerful attraction on travellers. They captivated visitors largely because of their natural beauty and the sense of awe inspired by dramatic landscapes. For early explorers, climbing to the summit was primarily about enjoyment and wonder, rather than proving personal strength. In contrast, today the peak is no longer seen merely as a scenic viewpoint but as a highly symbolic destination. Reaching the top has increasingly come to represent success, endurance, and a once-in-a-lifetime accomplishment that many people aspire to achieve.","Our changing the definition of mountains"],["For a large number of climbers, conquering a mountain summit embodies profound personal significance. The ‘summit’ is often interpreted as a metaphor for success in life, a clear representation of overcoming barriers and pushing human limits. The physical obstacles encountered on the climb mirror psychological struggles, which makes the achievement deeply rewarding. Over time, mountaineering has evolved into a cultural practice where people challenge themselves for adventure, resilience, and self-affirmation. Consequently, the scenery or encounters along the trail have become secondary to the psychological triumph of standing at the very top.","A unique sense of achievement"],["Mountaineering as a celebrated ‘achievement’ has been amplified by the phenomenon of the ‘summit selfie.’ Even in the pre-digital era, photographs at the summit were considered valuable mementos, proof of the effort invested. What began as a way to preserve memories gradually turned into an opportunity to broadcast one’s success to others. The rise of social media has intensified this trend, as climbers are often more concerned with capturing a perfect image than immersing themselves in the experience. In many cases, the journey itself becomes overshadowed by the simple desire to showcase the fact of having reached the summit.","Publicizing one's achievements"],["From this picture, critics conclude that the summit has become an end in itself, often detached from the original spirit of exploration. Many people now seem to disregard the multifaceted nature of mountaineering, treating it simply as a fashionable objective. For some, neither the genuine process of climbing nor the authentic arrival at the peak matters, their motivation is largely external. Furthermore, the preparation that should accompany such an endeavour—rigorous physical training, budgeting, and logistical planning—is frequently underestimated. As a result, the experience risks being superficial, emphasizing prestige rather than true engagement with the mountain.","The wrong priority"],["The photograph captured by Thomas in 1993 exposed the unsettling reality of contemporary mountaineering. It depicted hundreds of people queuing in a single file line to reach the summit—an image that contrasts starkly with the solitude once associated with genuine exploration. The climbers’ expressions reflected exhaustion and frustration rather than determination or joy, suggesting that the climb had lost its authenticity. Once publicized online, the image provoked widespread debate about whether the meaning of summiting had been reduced to mere spectacle. For many critics, it illustrated how the essence of mountaineering has been compromised by mass participation and social validation.","A disturbing revelation"],["One of the most urgent debates surrounding contemporary mountaineering concerns sustainability. Popular climbing destinations often suffer from waste accumulation, environmental degradation, and disrespect for local ecosystems. Many activists argue that this trend-driven approach to climbing must be reconsidered in order to preserve fragile landscapes. Responsibility, they emphasize, should be integral to every stage of the climbing journey, from preparation to leaving the site clean. Ultimately, they believe that the summit can only be considered ‘worthwhile’ if the path toward it contributes positively to both the environment and the climbers’ personal growth.","A focus on sustainability"],["Perhaps the time has come to reassess our perspective on climbing and return to its more authentic roots. Instead of pursuing mountains solely for recognition, individuals could rediscover the joy of walking, observing, and slowing down. In her autobiography, Cherke described how hiking offered her moments of reflection and a deeper connection with the natural world. Such experiences remind us that physical challenges can also be opportunities for serenity and contemplation. By cultivating a more intimate relationship with nature, climbing may once again regain its balance between personal fulfilment and environmental respect.","A more intimate relationship"]],"reading":[]},{"title":"Famous Female Mathematician – Emmy Noether","q":[["In 2014, Maryam Mirzakhani achieved something unexpected—she won the Fields Medal, becoming the first woman ever to receive it. It was a landmark moment in the history of mathematics, yet public reaction was mixed. Much of the media attention focused more on her being a woman than on the substantial mathematical work. Comparisons with male predecessors sometimes implied her success was less significant. This raised the question: do science and math still implicitly belong to men?","Gender obscures achievements"],["Even before Maryam, women have made noteworthy contributions to mathematics. Maria Gaetana Agnesi, an 18th-century Italian scholar, was the first to author a complete calculus text and to receive a university professorship in mathematics. Her work laid foundations in algebra, calculus, and analytical methods. Agnesi’s institutionalised success showed that precedent for women's excellence existed far earlier than modern discourse often acknowledges.","Acknowledging achievement of a pioneer"],["Philippa Garrett Fawcett is another such example. In 1890, she scored highest in the Cambridge Mathematical Tripos—more than 13% above the next-highest student—but was denied the formal title of Senior Wrangler because that distinction was reserved for men. Although she was widely praised and her result was publicly known, she did not receive the official honour. Her case illustrates how institutions privileged success in men, even when they clearly surpassed the norms. Society applauded her, but did not grant her equal status.","Men unfairly credited"],["Mary Cartwright had a mathematical career spanning over six decades. Her work in nonlinear differential equations laid the groundwork for chaos theory, influencing both mathematics and engineering. Despite the challenges faced by women in academia during her time, she maintained a consistent output of high-quality research throughout her life.","A long career showing exceptional ability"],["When female mathematicians are described as “women geniuses” or “female prodigies,” the gender label, while well-intentioned, often implies that excellence is rare among women. Such terms, though celebratory, can unintentionally reinforce the idea that women’s success in mathematical is unusual, rather than simply the result of talent and hard work.","Labels can change perspective"],["Recognition from awards and institutions has only recently begun to address the imbalance. Historically, major scientific prizes were almost exclusively awarded to men. But as awareness of gender bias has grown, some institutions have introduced policies to ensure women are given fair consideration—for example by selecting women for award shortlists or imposing minimum numbers. These steps have had effects, though critics ask whether they might lead to “tokenism” or whether merit is being compromised. Still, many argue that without these interventions, equality cannot be realized.","Attempting to create a gender balance"],["In efforts to level the playing field, some institutions have implemented standardized criteria for admissions or research evaluation. However, such uniform methods can sometimes ignore the diverse paths and challenges faced by individuals, particularly women balancing academic and societal expectations. A one-size-fits-all approach may not always foster true equality. Traditions of male dominance continue to influence science and education. Studies confirm that having diverse voices brings more creativity, more robust ideas, better science. When women are excluded or under-recognised, we lose potential breakthroughs. Deep-seated cultural assumptions show change slowly. For progress, society must act—through education, policy, and cultural change to value ability over gender.","Uniformity is as a disadvantage"]],"reading":[]}]],names=['Điền từ','Sắp xếp câu','Ghép người','Ghép tiêu đề'],tips=['Bấm vào chỗ trống và chọn từ phù hợp.','Kéo câu từ danh sách bên dưới vào từng ô, hoặc chạm một câu rồi chạm ô muốn đặt.','Đọc ý kiến rồi chọn người phù hợp với mỗi câu hỏi.','Đọc từng đoạn và chọn tiêu đề phù hợp.'];let p=0,b=0;const $=s=>document.querySelector(s);function el(tag,text,parent){let n=document.createElement(tag);n.textContent=text;parent.append(n);return n}function draw(){$('main').className=p===2?'part-three':'';let task=data[p][b];$('nav').replaceChildren();names.forEach((n,i)=>{let btn=el('button','Part '+(i+1),$('nav'));btn.className=p===i?'active':'';btn.onclick=()=>{p=i;b=0;draw()}});$('h1').textContent=names[p];$('#instruction').textContent=tips[p];let lessons=$('#lesson');lessons.replaceChildren();data[p].forEach((x,i)=>lessons.add(new Option('Bài '+(i+1)+' · '+x.title,i)));lessons.value=b;lessons.onchange=()=>{b=+lessons.value;draw()};$('aside').replaceChildren();if(task.reading.length){let a=el('article','',$('aside'));task.reading.forEach(([n,t])=>{el('h3',n,a);el('p',t,a)})}let area=document.querySelector('main > article');area.replaceChildren();if(p===1){drawOrder(task,area);return}task.q.forEach(([t,ans],i)=>{let row=el('div','',area);row.className='question';el('div','Câu '+(i+1),row).className='num';let l=el('label',p===1?'Vị trí '+(i+1):t,row);l.htmlFor='q'+i;let field=el('select','',row);field.id=l.htmlFor;if(p){field.add(new Option('.....',''));let choices=p===2?task.reading.map(x=>x[0]):task.q.map(x=>x[1]).sort((a,b)=>a.localeCompare(b,'en'));choices.forEach(x=>field.add(new Option(x,x)))}else {
  const wordChoices = [[["sun","morning","market"],["friends","house","car"],["stay","burn","leave"],["big","good","beautiful"],["sugar","beer","food"]],[["school","station","river"],["stops","towns","places"],["tired","color","green"],["dinner","food","eat"],["animals","films","bread"]],[["running","staying","seeing"],["garden","room","kitchen"],["forest","park","children"],["river","visit","house"],["old","slow","fast"]],[["love","run","should"],["small","tall","short"],["car","shop","window"],["animals","trees","people"],["show","visit","play"]]];

}el('output','',row);field.oninput=()=>{$('#score').textContent='';document.querySelectorAll('.question output').forEach(o=>o.textContent='')}});$('#score').textContent=''}$('#grade').onclick=()=>{if(p===1){gradeOrder();return}let count=0;data[p][b].q.forEach(([t,a],i)=>{let f=$('#q'+i),ok=f.value.trim().toLowerCase()===a.toLowerCase(),out=f.closest('.question').querySelector('output');count+=ok;feedback(out,i,f.value,a)});$('#score').textContent='Kết quả · '+count+' / '+data[p][b].q.length};
const reasons=[[["“In the morning” nghĩa là vào buổi sáng, cho biết thời điểm người nói đạp xe đi làm.","“My friends” là chủ ngữ số nhiều, phù hợp với động từ “cycle” và ý có người đi cùng.","“Leave my car at my house” nghĩa là để ô tô ở nhà vì đã đi làm bằng xe đạp.","Sau “feel” cần một tính từ chỉ cảm giác. “Feel good” nghĩa là cảm thấy khỏe, dễ chịu.","“Eat healthy food” nghĩa là ăn thức ăn lành mạnh, song song với việc uống nước."],["“Train station” là nhà ga, nơi người nghe được hướng dẫn đi đến cổng chính.","“Bus stops” nghĩa là các điểm dừng xe buýt. Dạng số nhiều phù hợp với “are”.","Người nói mô tả màu xanh của ngôi nhà để người đến dễ nhận ra.","“Have dinner” là cụm từ chỉ việc ăn tối.","“Watch films together” nghĩa là cùng nhau xem phim vào buổi tối."],["“We are staying” là thì hiện tại tiếp diễn, diễn tả việc đang ở tạm trong một ngôi nhà.","“Garden” là khu vườn, phù hợp với chi tiết có nhiều cây.","Sau “with our” cần người cùng đi câu. “Our children” nghĩa là các con của chúng tôi.","“Be going to” đi với động từ nguyên mẫu. “Visit the town” nghĩa là đến thăm thị trấn.","“Old buildings” là những tòa nhà cổ. “Old” mô tả tuổi của công trình."],["“Love the area” diễn tả tình cảm của người nói với khu vực mình sống.","“Very small” mô tả kích thước căn bếp.","Chi tiết “I sell clothes” cho biết người nói làm việc ở cửa hàng.","“Talk to many people” nghĩa là nói chuyện với nhiều người, phù hợp với công việc bán hàng.","“Visit you soon” diễn tả mong muốn sớm đến thăm người nhận thư."]],[["Câu mở đầu xác định thời điểm và giới thiệu cuộc đua cho người lớn.","“Ran in this” nhắc lại cuộc đua vừa được giới thiệu và cho biết ai thắng.","“After receiving the prize” nối kết quả cuộc đua với hoạt động tiếp theo của trẻ em.","“These activities” chỉ các hoạt động của trẻ em vừa được nhắc tới.","“After all these” cho biết bữa ăn diễn ra sau khi các hoạt động kết thúc."],["Câu đầu nêu nhận xét chung về sự khác biệt giữa phim xưa và nay.","“This is because” giải thích sự khác biệt bằng hai đặc điểm đen trắng và không có âm thanh.","“These technical limitations” chỉ hai hạn chế ở câu trước rồi bổ sung vấn đề kinh phí.","“This lack of money” nhắc lại ngân sách thấp và giải thích tác động đến diễn viên.","“Things have changed over time” chuyển từ thu nhập thấp ngày xưa sang thu nhập của diễn viên về sau."],["“In the past” mở đầu bằng hoàn cảnh đi lại thời xưa.","Việc phát minh ô tô và tàu hỏa giải thích vì sao đi lại dần rẻ hơn.","“These two means of transport” chỉ ô tô và tàu hỏa, trước khi đoạn văn giới thiệu máy bay.","“Flying with them” nối trực tiếp với máy bay vừa được nhắc đến.","Câu cuối tổng kết tác động của các cải tiến giao thông đối với việc đi lại."],["“It” chỉ quán cà phê trên phố Corner đã được giới thiệu ở câu số 0.","“Despite the crowd” nhắc lại cảnh đông người và dẫn đến việc nhân viên mang thực đơn ra.","“The menu” là thực đơn vừa được mang đến bàn.","Sau khi xem các món, người kể mới chọn chiếc bánh sandwich đắt nhất.","“It was really good” nhận xét chiếc bánh đã chọn và kết thúc bằng ý định quay lại."],["“Before starting writing” giới thiệu bước đầu tiên là tìm hiểu địa điểm.","“These” chỉ những chi tiết cần tìm hiểu, gồm con người, ngôn ngữ và lịch sử.","“Three areas” nhắc đúng ba nội dung vừa liệt kê và đưa ra yêu cầu so sánh.","“This comparison” nhắc lại việc so sánh với đất nước của mình.","“Those” chỉ các điểm tương đồng giữa hai nước được nói đến ngay trước đó."],["Câu đầu giới thiệu tên và nghề nghiệp của Jade.","“Before becoming famous” đưa người đọc trở lại thời Jade học nghệ thuật và âm nhạc.","“During this education” chỉ quãng thời gian học ở trường vừa nêu.","“During his performances” tiếp nối việc Jade bắt đầu biểu diễn trên sân khấu.","Cách ăn mặc ở câu này nhắc lại quần áo sáng màu và việc vẽ mặt ở câu trước.","“They” chỉ những người đã chú ý đến Jade rồi theo dõi anh trên mạng xã hội."],["Câu đầu giới thiệu ngày chào đón sinh viên và ngày tổ chức.","“The day” chỉ ngày chào đón, mở đầu bằng một bài thuyết trình.","“At the end of this talk” xác định việc gặp giảng viên xảy ra sau bài thuyết trình.","“These staff members” là các trưởng khoa và giảng viên vừa được giới thiệu.","“During this visit” nhắc đến chuyến tham quan và dẫn tới giờ ăn trưa.","“This meal” chính là bữa trưa ở câu trước, giờ mới nêu địa điểm dùng bữa."],["“Last Saturday” giới thiệu buổi biểu diễn và địa điểm tổ chức.","Sau khi giới thiệu sự kiện, đoạn văn nêu ai tổ chức và chi trả.","“Because it was free” nối với việc chính quyền chi trả và giải thích số người tham dự.","“Many of them” chỉ hơn 5.000 người tham dự vừa nêu.","“The staff there” là nhân viên ở những cửa hàng mà khán giả đã ghé qua.","“He” chỉ nam ca sĩ nổi tiếng xuất hiện ở cuối câu trước."],["Câu đầu giới thiệu gia đình Mae qua nghề nghiệp của cha mẹ.","“With the support from parents” nối thông tin gia đình với việc Mae vào đại học.","“Her degree” nhắc đến bằng cấp sau khi Mae học khoa học.","“This” chỉ khóa đào tạo ở Mỹ và giải thích cách Mae gia nhập nhóm nghiên cứu.","“This group” chính là nhóm nghiên cứu mà Mae vừa gia nhập.","“Some of those” chỉ những thí nghiệm Mae đã thực hiện trong không gian."],["“Two of these” chỉ các chương lịch sử địa phương đã học trong câu mở đầu số 0.","“It” chỉ dự án cuối kỳ và câu này nêu nội dung cần có.","“Then” chuyển sang bước dùng hình ảnh và bài viết đã chuẩn bị để làm bài thuyết trình.","“Your presentation” nhắc lại sản phẩm vừa tạo và cho biết thời lượng trình bày.","“After this time” chỉ lúc kết thúc năm phút trình bày, khi các bạn khác đặt câu hỏi."]],[["Lisa thấy các tiết mục khá nhạt nhòa và nói có lẽ sẽ không quay lại.","Robert nói chi phí cao đến mức nhiều sinh viên, kể cả anh, khó có thể chi trả.","James mong có chút nắng để hai ngày đầu của lễ hội thú vị hơn.","Christina vui khi gặp lại các thành viên cũ của ban nhạc và trò chuyện sau buổi diễn.","James được gặp các ca sĩ yêu thích vào ngày cuối nên ấn tượng của anh thay đổi.","Christina kể địa điểm cách xa đường chính khiến ban nhạc khó chuyển nhạc cụ.","Robert thích nhiều thể loại và nhận xét các bài hát, giai điệu đều rất ấn tượng."],["Jose nói mình yêu thích môn lặn ngay từ lần đầu thử.","Sira thích cảm giác được cá bơi xung quanh khi lặn.","Bao kể mình không thích hoạt động thể thao ở trường và thích ở nhà đọc sách.","Marisol là phi công và cho rằng công việc đã có đủ hoạt động mạo hiểm.","Jose học kỹ hướng dẫn của huấn luyện viên trước khi theo đuổi môn lặn.","Sira sống xa biển, chỉ lặn được vài lần mỗi năm và thấy như vậy chưa đủ.","Marisol thích những môn quen thuộc như bóng chày hoặc bóng chuyền."],["Sophia thường đến thư viện và có thể đọc truyện hàng giờ.","Jack phát hiện niềm yêu thích hội họa khi mẹ tặng một hộp dụng cụ vẽ.","William kể mình thường chạy nhảy và chơi đuổi bắt cùng bạn bè.","Sarah thấy luật trò chơi ngày xưa đơn giản, còn trò chơi hiện đại phức tạp hơn.","Sarah nhắc đến những lần cùng hai con trai chơi và cười đùa.","Jack kể những hôm trời âm u thường nhìn ra cửa sổ, mong được ra ngoài.","Sophia nói mình đặc biệt thích các trò chơi tương tác trên máy tính."],["Chinua nói công việc chân tay khi xây nhà giúp cải thiện sức khỏe thể chất.","Chirish thích gặp người mới và tạo thêm các mối quan hệ qua hoạt động tình nguyện.","Chinua kể nhóm được cử tới nhiều quốc gia, vừa làm việc có ích vừa đi đây đó.","Boyd nhấn mạnh rằng ngay trong mỗi thị trấn đã có nhiều người cần giúp đỡ.","Boyd nói trò chuyện với người dân giúp hiểu lịch sử, truyền thống và văn hóa địa phương.","Chirish cho rằng kỹ năng mềm và quan hệ có được sẽ giúp ích cho nghề nghiệp sau này.","Noah bận rộn nên chọn đóng góp tiền hằng tháng."],["Chirish nhận xét kỳ thực tập ở trường học rất đáng giá dù khối lượng công việc lớn.","Olivia làm tình nguyện không lương nhưng tích lũy kiến thức và được thử nhiều loại công việc.","Emma ước mình đã chọn khóa điện ngắn hạn thay vì học cả chương trình đại học.","Grace hài lòng với công việc kết hợp và chấp nhận cả những buổi làm việc buổi tối.","Chirish luôn muốn làm giáo viên nên không có nhu cầu tìm hiểu nghề khác.","Grace khó tìm việc vì các công ty yêu cầu kinh nghiệm.","Emma thích làm những việc thực hành như kiểm tra ống nước và vặn vít."]],[["Đoạn mở đầu mô tả tuần làm việc năm hoặc sáu ngày từng là chuẩn mực nhưng đang dần mất tính phù hợp.","Ngày nghỉ thêm giúp nhân viên nghỉ ngơi, ở bên gia đình, tập trung hơn và hài lòng hơn với công việc.","Chi phí thuê người và điều chỉnh lương có thể làm giảm lợi nhuận, thậm chí dẫn đến sa thải.","Áp lực hoàn thành cùng lượng việc trong ít ngày hơn, xung đột lịch và trễ hạn là các khó khăn phát sinh.","Trọng tâm là thói quen và nếp làm việc lâu năm khiến một số người khó thích nghi.","Nhân viên y tế và dịch vụ có thể không được giảm giờ làm, tạo ra sự bất bình đẳng.","Đoạn cuối đề xuất cho chọn ngày làm hoặc rút ngắn giờ mỗi ngày như các phương án thay thế."],["Đoạn đối chiếu cách nhìn trước kia coi núi là cảnh đẹp với quan niệm hiện nay xem đỉnh núi như biểu tượng thành công.","Đỉnh núi tượng trưng cho việc vượt giới hạn, đem lại cảm giác thành tựu cá nhân.","Ảnh chụp trên đỉnh và mạng xã hội giúp người leo núi công khai thành tích của mình.","Đoạn phê phán việc đặt danh tiếng và đích đến cao hơn trải nghiệm cũng như sự chuẩn bị.","Bức ảnh hàng người xếp hàng lên đỉnh gây tranh luận vì phơi bày mặt đáng lo của hoạt động leo núi.","Rác thải, hệ sinh thái và trách nhiệm bảo vệ cảnh quan là những dấu hiệu của chủ đề phát triển bền vững.","Việc đi chậm, quan sát và suy ngẫm giúp người leo núi gắn bó sâu sắc hơn với thiên nhiên."],["Truyền thông chú ý đến giới tính của Maryam nhiều hơn nội dung công trình đoạt giải của bà.","Đoạn nêu các đóng góp tiên phong của Maria Gaetana Agnesi trong giáo dục và toán học.","Fawcett đạt điểm cao nhất nhưng danh hiệu chính thức khi ấy chỉ dành cho nam giới.","Sự nghiệp hơn sáu thập kỷ của Cartwright cùng các công trình chất lượng cho thấy năng lực bền bỉ.","Những nhãn như “female prodigies” có thể khiến độc giả coi thành công của phụ nữ là ngoại lệ.","Các function feedback(out,i,selected,answer){
  const correct=selected===answer;
  out.className=correct?'ok':'bad';
  out.replaceChildren();
  el('strong',correct?'✓ Đúng':selected?'✗ Sai':'Chưa trả lời',out);
  if(selected && !correct)el('div','Bạn chọn: '+selected,out);
  el('div','Đáp án đúng: '+answer,out);
  el('div','Lời giải: '+reasons[p][b][i],out).className='reason';
}
let gradeOrder;
function drawOrder(task,area){
  const sentences=task.q.map(q=>q[1]);
  const pool=sentences.map((_,i)=>i);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
  if(pool.every((v,i)=>v===i)) pool.reverse();
  const slots=Array(sentences.length).fill(null);
  let picked=null, graded=false;
  function place(id,position){
    if(!Number.isInteger(id)||id<0||id>=sentences.length)return;
    const old=slots.indexOf(id);
    if(old>=0) slots[old]=position===null?null:slots[position];
    if(position!==null) slots[position]=id;
    picked=null; graded=false; render();
  }
  function dropOn(element,position){
    element.ondragover=e=>e.preventDefault();
    element.ondrop=e=>{e.preventDefault();const value=e.dataTransfer.getData('text/plain');if(/^\d+$/.test(value))place(Number(value),position)};
  }
  function enableDrag(button,id){
    button.draggable=true;
    button.ondragstart=e=>{e.dataTransfer.setData('text/plain',String(id));e.dataTransfer.effectAllowed='move'};
    if(picked===id)button.classList.add('picked');
  }
  function render(){
    area.replaceChildren();$('#score').textContent='';
    slots.forEach((id,i)=>{
      const btn=el('button',(i+1)+'.  '+(id===null?'.....':sentences[id]),area);
      btn.className='slot';dropOn(btn,i);
      if(id!==null)enableDrag(btn,id);
      btn.onclick=()=>{if(picked!==null&&picked!==id)place(picked,i);else{picked=picked===id?null:id;render()}};
      if(graded){const out=el('output','',area);feedback(out,i,id===null?'':sentences[id],sentences[i])}
    });
    const bank=el('section','',area);bank.className='bank';dropOn(bank,null);
    el('h3','Danh sách câu',bank);
    pool.filter(id=>!slots.includes(id)).forEach(id=>{
      const btn=el('button',sentences[id],bank);btn.className='tile';enableDrag(btn,id);
      btn.onclick=()=>{picked=picked===id?null:id;render()};
    });
    if(picked!==null&&slots.includes(picked))el('button','Trả câu về danh sách',bank).onclick=()=>place(picked,null);
    if(graded)$('#score').textContent='Kết quả · '+slots.filter((id,i)=>id===i).length+' / '+slots.length;
  }
  gradeOrder=()=>{graded=true;render()};render();
}
$('#reset').onclick=draw;draw()</script></html>
